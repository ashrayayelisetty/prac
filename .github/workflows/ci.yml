name: Pyhton CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      -name: Check repo
      uses: actions/checkout@v4

      -name: set up python
      uses: actions/setup-python@v5

      -name: Install dependices
      run:python -m pip install -r requiremnets.txt

      -name: RUn tests
      run: python -m pytest -v